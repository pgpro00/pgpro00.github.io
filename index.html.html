:root{--ink:#1F2A44;--cr:#FFF8EE;--ye:#FFC93C;--co:#FF6B4A;--vi:#6C5CE7;--mi:#2EC4A6;--mu:#4F5873}
*{box-sizing:border-box;margin:0}body{font:16px/1.4 Nunito,system-ui,sans-serif;color:var(--ink);background:#e9e4da;display:grid;place-items:center;min-height:100vh}
body.all{display:flex;flex-wrap:wrap;gap:20px;padding:20px;width:2480px;place-items:start}
button{font-family:inherit;color:inherit;cursor:pointer}
.scr{width:390px;height:844px;background:var(--cr);display:none;flex-direction:column;position:relative;overflow:hidden}.scr.on,.all .scr{display:flex}
body:not(.all) .scr{border-radius:36px;box-shadow:0 10px 40px #0003}
h1{font:600 27px/1.15 Fredoka,sans-serif;margin:6px 0 6px}h2{font:600 20px Fredoka,sans-serif}.sub{color:var(--mu);font-size:15px;margin-bottom:10px}.mu{color:var(--mu);font-size:14px}
.hd{display:flex;align-items:center;gap:12px;padding:16px 20px 0}.ht{font:600 18px Fredoka,sans-serif}.lg{font:600 26px Fredoka,sans-serif}
.bk{height:52px;min-width:52px;padding:0 18px;border:2px solid var(--ink);border-radius:26px;background:#fff;font:700 16px Nunito,sans-serif;box-shadow:0 3px 0 var(--ink)}
.main{flex:1;padding:12px 20px 0;overflow:hidden}
.foot{padding:12px 20px 16px;background:#fff;border-top:2px solid var(--ink);border-radius:24px 24px 0 0}
.btn{width:100%;height:64px;border-radius:32px;border:2px solid var(--ink);background:var(--co);color:var(--ink);font:700 18px Nunito,sans-serif;box-shadow:0 4px 0 var(--ink)}.btn.s{background:#fff;height:56px;font-size:16px}
.lnk{display:block;width:100%;height:52px;background:none;border:0;color:var(--mu);font:600 14px Nunito,sans-serif;text-decoration:underline}
.cd{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:15px}
.lb{font-weight:700;font-size:14px;margin:8px 0 4px}.fl{height:56px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:0 14px;display:flex;align-items:center;color:var(--mu);margin-bottom:8px}
.up{height:56px;border:2px dashed var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:10px;background:#fff}
.tg{display:inline-block;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--mi)}.tg.y{background:var(--ye)}.tg.g{background:#e3e0d8}
.fl2{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-7px)}}.wv{transform-origin:98px 88px;animation:wv 1.6s ease-in-out infinite}@keyframes wv{50%{transform:rotate(-24deg)}}.ey{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
